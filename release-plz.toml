[workspace]
pr_draft = false
pr_labels = ["release"]
publish = true
release_always = true
git_tag_enable = true
git_release_enable = true
changelog_update = true

# The library's tags stay `v<version>`, as before the example joined the
# workspace; release-plz would otherwise prefix them with the package name.
[[package]]
name = "shaderloom"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# The example is not a release artifact.
[[package]]
name = "flame-example"
release = false
publish = false
