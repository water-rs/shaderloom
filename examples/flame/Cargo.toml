[package]
name = "flame-example"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
description = "Flame example: a build-time compiled shader rendered by winit and wgpu"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/water-rs/shaderloom"
keywords = ["wgpu", "shader", "example", "flame"]
categories = ["graphics"]
publish = false

[dependencies]
shaderloom = { path = "../.." }
wgpu = "30.0.1"
winit = "0.30"
pollster = "0.4"
bytemuck = "1"

[build-dependencies]
shaderloom = { path = "../..", default-features = false, features = ["build"] }

# `shaderloom` is used directly by build.rs; cargo-machete 0.9 does not scan build.rs.
[package.metadata.cargo-machete]
ignored = ["shaderloom"]
