name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The workspace-wide check compiles the flame example's framework graph:
      # khronos-egl probes egl.pc, gbm-sys/pipewire-sys/cros-libva/wayland-sys
      # probe their pkg-config names (xcap -> waterkit-screen), and ash needs
      # the Vulkan loader and a lavapipe ICD. xcb's build script wants
      # libxcb1-dev. `cargo tree -e normal,build,dev --workspace --target
      # x86_64-unknown-linux-gnu` shows no xkbcommon-sys, fontconfig, or alsa.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl-dev libgbm-dev libpipewire-0.3-dev \
            libxcb1-dev libva-dev libwayland-dev mesa-vulkan-drivers libvulkan1
      # `filtrate` (waterui-graphics -> example) runs dxc from its build script
      # to compile WGSL to DXIL; the Windows runner image does not ship it.
      - name: Install DirectX Shader Compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-dxc
      - uses: Swatinem/rust-cache@v2
      # The example's `dev` feature turns on the framework's dynamic linking,
      # which links the whole framework into one dylib; on Windows that trips
      # MSVC's 65535-object library limit (LNK1189). The example builds with its
      # default features, and `--all-features` stays on the component itself.
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p shaderloom --all-features
      - run: cargo test -p shaderloom --doc --all-features
      - run: cargo check --workspace --all-targets

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p shaderloom --all-targets --all-features -- -D warnings

  # The runtime dependency is `wgpu` alone; `naga` may only enter through the
  # optional `build` feature. Checking the default feature set on its own keeps
  # a shader compiler out of every consumer's binary.
  features:
    name: Feature isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features
      - run: cargo check
      - run: cargo check --features build

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The floor is whatever `Cargo.toml` declares, read here rather than
      # written twice: a hardcoded version in CI drifts from the manifest and
      # then gates a number nobody declared.
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Installing a toolchain is not building with it: the action only
          # sets the rustup default, and this repository's
          # `rust-toolchain.toml` overrides the default for every cargo
          # invocation inside the checkout. Without this env var the job
          # compiled on `stable` and proved nothing about the floor.
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Proof in the log that the floor is what compiled, so a later change to
      # the pin or the action cannot quietly make this a second stable run.
      - name: Show the toolchain this job builds with
        run: rustc --version && cargo --version
      - run: cargo check -p shaderloom --all-features
