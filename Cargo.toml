[package]
name = "shaderloom"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/shaderloom"
description = "Build-time WGSL compilation and embedded native shader artifacts for wgpu"
keywords = ["wgpu", "shader", "wgsl", "metallib", "spirv"]
categories = ["graphics", "development-tools::build-utils"]

[dependencies]
wgpu = "29.0.4"
naga = { version = "29.0.1", optional = true, features = ["hlsl-out", "msl-out", "spv-out", "wgsl-in"] }

[dev-dependencies]
# The SPIR-V opcode table, so the writer-option tests name opcodes from the
# specification instead of restating their numbers. Same version naga uses.
spirv = "0.4"

[features]
default = []
build = ["dep:naga"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
style = "warn"
correctness = "warn"
complexity = "warn"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }
