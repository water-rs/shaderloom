[workspace]
members = ["examples/flame"]
resolver = "2"

[package]
name = "shaderloom"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/shaderloom"
description = "Build-time WGSL compilation and embedded native shader artifacts for wgpu"
keywords = ["wgpu", "shader", "wgsl", "metallib", "spirv"]
categories = ["graphics", "development-tools::build-utils"]

[dependencies]
wgpu = { version = "29.0.4", optional = true }
naga = { version = "29.0.1", optional = true, features = ["hlsl-out", "msl-out", "spv-out", "wgsl-in"] }
# The packaged-shader manifest is TOML, shared between the `build` writer and
# the always-compiled `packaged` reader.
serde = { version = "1", features = ["derive"] }
toml = "1.1"
quote = { version = "1", optional = true }
proc-macro2 = { version = "1", optional = true }
syn = { version = "3", optional = true, features = ["full", "parsing"] }
prettyplease = { version = "0.3", optional = true }

[dev-dependencies]
# The SPIR-V opcode table, so the writer-option tests name opcodes from the
# specification instead of restating their numbers. Same version naga uses.
spirv = "0.4"

[[bin]]
name = "shaderloom"
path = "src/bin/shaderloom.rs"
required-features = ["build"]

[features]
default = ["runtime", "build"]
# Runtime shader-module API (`CompiledShader`, `WgslModuleCache`, …) — the only
# part of the crate that links `wgpu`.
runtime = ["dep:wgpu"]
# Build-script API (`shaderloom::build`) and the `shaderloom` CLI. Declare it
# with `default-features = false` so the host side compiles `naga` without
# `wgpu`.
build = ["dep:naga", "dep:quote", "dep:proc-macro2", "dep:syn", "dep:prettyplease"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
style = "warn"
correctness = "warn"
complexity = "warn"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }
